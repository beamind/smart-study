## Project-wide Gradle settings (SAFE TO COMMIT)
## 注意：不要在这里放任何密钥/口令/keystore 路径等敏感信息。

# JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Optional: reduce Windows file-lock/cache issues during local development
org.gradle.unsafe.configuration-cache=false
org.gradle.caching=false
org.gradle.vfs.watch=false

# Force Gradle to run with JDK 17+ (AGP 8.x requirement).
# Android Studio bundles a compatible JBR under:
#   C:\Program Files\Android\Android Studio\jbr
# This prevents CLI builds from accidentally using an old system Java (e.g. JDK 8).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
