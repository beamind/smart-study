apply plugin: 'com.android.application'

def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version.toString()
// versionCode = major * 10000 + minor * 100 + patch, so minor and patch must stay below 100.
def versionParts = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!versionParts.matches()) throw new GradleException("package.json version must be major.minor.patch (digits only), got: ${appVersion}")
def (versionMajor, versionMinor, versionPatch) = (1..3).collect { versionParts.group(it).toInteger() }
if (versionMinor > 99 || versionPatch > 99) throw new GradleException("package.json version ${appVersion}: minor and patch must be 0-99 for the versionCode")

/**
 * Release signing (docs/decisions/003). The key and its passwords never enter the repository: they are read
 * from a keystore.properties file: the one given by -PsmartStudyKeystore=<file> or the environment variable
 * SMART_STUDY_KEYSTORE_PROPERTIES (the build stops if it does not exist), otherwise <repo>/keystore.properties
 * or ~/.smartstudy/keystore.properties.
 * Without one, assembleRelease produces an unsigned APK and tools/build_android.ps1 -Release stops.
 */
// Relative paths are relative to the repository root.
def repoFile = { String path -> new File(path).isAbsolute() ? new File(path) : rootProject.file("../${path}") }
def explicitSigning = project.findProperty('smartStudyKeystore') ?: System.getenv('SMART_STUDY_KEYSTORE_PROPERTIES')
if (explicitSigning && !repoFile(explicitSigning.toString()).isFile()) {
    // A key that was asked for explicitly must not be replaced silently by another one.
    throw new GradleException("keystore.properties not found: ${explicitSigning}")
}
def signingFile = (explicitSigning
    ? [repoFile(explicitSigning.toString())]
    : [rootProject.file('../keystore.properties'), new File("${System.getProperty('user.home')}/.smartstudy/keystore.properties")]
).find { it.isFile() }
def signing = new Properties()
if (signingFile) {
    // Read as UTF-8 (Notepad's default), so a path with Chinese characters in it is not garbled.
    signingFile.withReader('UTF-8') { signing.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !signing.getProperty(it) }
    if (missing) throw new GradleException("${signingFile} is missing ${missing.join(', ')}")
}

android {
    namespace = "com.smartstudy"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.smartstudy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The version comes from package.json, like the APK file name and the settings page (which shows the version of the
        // web build in dist/; tools/build_android.ps1 -SkipWebBuild reuses an existing one).
        versionName appVersion
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingFile) {
            release {
                // storeFile may be relative to the properties file.
                storeFile signingFile.parentFile.toPath().resolve(signing.getProperty('storeFile')).toFile()
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // A separate app (com.smartstudy.dev) for testing next to the release build; the visible name stays 智能学习.
            applicationIdSuffix ".dev"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingFile) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
