// 合并单元测试和Android测试的覆盖率报告
task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest', 'connectedAndroidTest']) {
    group = "verification"
    description = "生成合并的代码覆盖率报告（单元测试 + Android测试）"
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/models/**',
        '**/*Module*.*',
        '**/*Dagger*.*',
        '**/*MembersInjector*.*',
        '**/*_Factory*.*',
        '**/*_Provide*Factory*.*',
        '**/*Extensions*.*',
        '**/*Application*.*',
        '**/*Activity*.*',
        '**/*Fragment*.*',
        '**/*Adapter*.*',
        '**/*ViewHolder*.*',
        '**/*ViewBinding*.*',
        '**/BR.*',
        '**/DataBinderMapperImpl*.*',
        '**/DataBindingTriggerClass*.*',
        '**/BuildConfig.*',
        '**/*$ViewInjector*.*',
        '**/*Dagger*.*',
        '**/*Hilt*.*',
        '**/*MembersInjector*.*',
        '**/*_Factory*.*',
        '**/*_Provide*Factory*.*',
        '**/*Extensions*.*',
        '**/*_Impl*.*',
        '**/*_HiltModules*.*',
        '**/*_Factory*.*',
        '**/*_Generated*.*',
        '**/com/smartstudy/dictation/core/sherpa/**',
        '**/com/smartstudy/dictation/core/tts/**',
    ]
    
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"
    
    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    
    // 合并单元测试和Android测试的执行数据
    executionData.setFrom(fileTree(dir: buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest.exec',
        'outputs/code-coverage/connected/*coverage.ec'
    ]))
}
