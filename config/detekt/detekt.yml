build:
  maxIssues: 0

config:
  validation: true

processors:
  active: true

comments:
  active: true

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 12
  NestedBlockDepth:
    active: true
    threshold: 6

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
  VariableNaming:
    active: true
  TopLevelPropertyNaming:
    active: true

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  MagicNumber:
    active: false
  ReturnCount:
    active: true
  ThrowsCount:
    active: true
  MaxLineLength:
    active: false
