<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能学习</title>
</head>
<body>
  <!-- Shown by Capacitor (server.errorPath in capacitor.config.ts) when the WebView is older than minWebViewVersion,
       or when the app page itself fails to load. -->
  <h1>智能学习无法打开</h1>
  <p>最常见的原因是这台设备的 Android System WebView 版本太旧，智能学习需要 98 或更高的版本。</p>
  <p>请在应用商店里更新“Android System WebView”（有的设备叫“Chrome”），然后重新打开智能学习。数据文件夹里的数据不会丢失。</p>
</body>
</html>
